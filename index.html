<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Govt Subsidies Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">JanSeva Subsidies</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search subsidies..." onkeyup="filterSchemes()">
        </div>
        <button class="btn-login">Login</button>
    </header>

    <section class="hero">
        <h1>Find Government Subsidies & Schemes</h1>
        <p>Explore financial assistance provided by central & state governments.</p>
    </section>

    <main class="container">
        <h2>Available Schemes</h2>
        <div class="grid" id="schemesGrid">
            <!-- Cards populated dynamically via API -->
        </div>
    </main>

    <script>
        let allSchemes = [];

        async function fetchSchemes() {
            try {
                const response = await fetch('/api/schemes');
                allSchemes = await response.json();
                renderSchemes(allSchemes);
            } catch (err) {
                console.error("Error loading schemes:", err);
            }
        }

        function renderSchemes(schemes) {
            const grid = document.getElementById('schemesGrid');
            grid.innerHTML = schemes.map(scheme => `
                <div class="card">
                    <span class="badge green">${scheme.status}</span>
                    <h3>${scheme.title}</h3>
                    <p>${scheme.description}</p>
                    <div class="card-footer">
                        <span class="benefit">${scheme.benefit}</span>
                        <a href="details.html?scheme=${scheme.slug}" class="btn-primary">View Details</a>
                    </div>
                </div>
            `).join('');
        }

        function filterSchemes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allSchemes.filter(s => 
                s.title.toLowerCase().includes(query) || 
                s.category.toLowerCase().includes(query)
            );
            renderSchemes(filtered);
        }

        fetchSchemes();
    </script>
</body>
</html>
